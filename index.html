<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divulgação de Vagas de Estágio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Vagas de Estágio</h1>
        <p>Cadastre e encontre oportunidades de estágio.</p>
    </header>

    <main>
        <section class="cadastro">
            <h2>Cadastrar Vaga</h2>

            <form id="formVaga">
                <label for="empresa">Empresa</label>
                <input type="text" id="empresa" required>

                <label for="vaga">Nome da Vaga</label>
                <input type="text" id="vaga" required>

                <label for="curso">Curso</label>
                <input type="text" id="curso" required>

                <label for="local">Local</label>
                <input type="text" id="local" required>

                <button type="submit">Cadastrar Vaga</button>
            </form>
        </section>

        <section class="vagas">
            <h2>Vagas Disponíveis</h2>

            <table>
                <thead>
                    <tr>
                        <th>Empresa</th>
                        <th>Vaga</th>
                        <th>Curso</th>
                        <th>Local</th>
                    </tr>
                </thead>

                <tbody id="listaVagas">
                    <!-- As vagas aparecerão aqui -->
                </tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
